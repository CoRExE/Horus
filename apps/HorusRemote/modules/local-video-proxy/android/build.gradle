plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.localvideoproxy'
version = '0.1.0'

android {
  namespace "expo.modules.localvideoproxy"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles "proguard-rules.pro"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
