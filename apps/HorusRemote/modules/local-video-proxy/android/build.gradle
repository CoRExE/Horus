plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.localvideoproxy'
version = '0.1.0'

android {
  namespace "expo.modules.localvideoproxy"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles "proguard-rules.pro"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'org.nanohttpd:nanohttpd:2.3.1'
  implementation 'com.google.android.gms:play-services-cronet:18.0.1'
  // Keep Media3 aligned with expo-video to avoid duplicate/incompatible media stacks.
  implementation 'androidx.media3:media3-transformer:1.8.0'
}
