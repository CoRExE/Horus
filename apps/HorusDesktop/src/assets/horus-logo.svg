<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background / Glow Gradients -->
    <linearGradient id="prism-edge-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="prism-edge-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="eye-glow-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <linearGradient id="glass-facet-left" x1="50%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="glass-facet-right" x1="50%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0.05" />
    </linearGradient>
    <radialGradient id="central-glow" cx="50%" cy="52%" r="45%">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#8B5CF6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="intense-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="265" r="210" fill="url(#central-glow)" />

  <!-- 3D Pyramid Glass Faces -->
  <!-- Left Facet -->
  <polygon points="256,92 104,364 256,412" fill="url(#glass-facet-left)" />
  <!-- Right Facet -->
  <polygon points="256,92 256,412 408,364" fill="url(#glass-facet-right)" />

  <!-- Pyramid Edge Bevels & Highlights -->
  <line x1="256" y1="92" x2="104" y2="364" stroke="url(#prism-edge-cyan)" stroke-width="4.5" stroke-linecap="round" filter="url(#neon-glow)" />
  <line x1="256" y1="92" x2="408" y2="364" stroke="url(#prism-edge-purple)" stroke-width="4.5" stroke-linecap="round" filter="url(#neon-glow)" />
  <line x1="104" y1="364" x2="256" y2="412" stroke="#00FFFF" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round" />
  <line x1="408" y1="364" x2="256" y2="412" stroke="#8B5CF6" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round" />
  <line x1="256" y1="92" x2="256" y2="412" stroke="#E2E8F0" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 6" />

  <!-- Central Holographic Eye of Horus -->
  <g filter="url(#intense-glow)">
    <!-- Upper Eyelid Arch -->
    <path d="M 172 260 C 205 220, 307 220, 340 260" stroke="url(#eye-glow-grad)" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M 188 245 C 220 216, 292 216, 324 245" stroke="#00FFFF" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Lower Eyelid Arch -->
    <path d="M 172 260 C 210 294, 302 294, 340 260" stroke="url(#eye-glow-grad)" stroke-width="6" stroke-linecap="round" fill="none" />

    <!-- Horus Teardrop / Mark Downward -->
    <path d="M 292 284 L 298 335 L 282 312 Z" fill="url(#prism-edge-purple)" stroke="#A78BFA" stroke-width="2" stroke-linejoin="round" />

    <!-- Horus Spiral Curl (Falcon Mark) -->
    <path d="M 215 284 C 205 325, 230 342, 246 330 C 255 322, 252 308, 240 310 C 232 312, 228 322, 234 326"
          stroke="url(#prism-edge-cyan)" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- Outer Eyebrow / Extension line -->
    <path d="M 160 260 L 174 260" stroke="#00FFFF" stroke-width="5" stroke-linecap="round" />
    <path d="M 338 260 L 354 260" stroke="#8B5CF6" stroke-width="5" stroke-linecap="round" />

    <!-- Pupil: Glowing Media Play Button -->
    <polygon points="244,242 276,260 244,278" fill="#FFFFFF" filter="url(#neon-glow)">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2.5s" repeatCount="indefinite" />
    </polygon>
  </g>
</svg>
