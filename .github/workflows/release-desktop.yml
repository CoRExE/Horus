name: Release Desktop
run-name: Release Desktop · ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag desktop-vX.Y.Z existant
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" == desktop-v* ]]
          node scripts/release/version.mjs "$TAG"
          commit="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          [[ "$(git rev-parse HEAD)" == "$commit" ]]
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

  checks:
    needs: version
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.version.outputs.commit }}

  build:
    needs: [version, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
            suffix: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
            suffix: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
      CARGO_TERM_COLOR: never
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      SUFFIX: ${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.88.0 --profile minimal --target "$TARGET"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/HorusDesktop/src-tauri/target
          key: release-cargo-${{ runner.arch }}-1.88-${{ hashFiles('apps/HorusDesktop/src-tauri/Cargo.lock', 'apps/HorusDesktop/src-tauri/src/**', 'apps/HorusDesktop/src-tauri/*.json') }}
          restore-keys: release-cargo-${{ runner.arch }}-1.88-
      - uses: actions/cache@v4
        with:
          path: build/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/release/*ffmpeg*') }}
      - name: Compiler FFmpeg et préparer sources et licences
        run: |
          mkdir -p .ci-logs
          bash scripts/release/build-ffmpeg.sh 2>&1 | tee .ci-logs/ffmpeg.log
      - name: Tester le moteur média avec FFmpeg embarqué
        run: |
          brew list ffmpeg || brew install ffmpeg
          pnpm --filter horus-desktop test:fixtures
          mkdir -p "$RUNNER_TEMP/horus-bin"
          cp "apps/HorusDesktop/src-tauri/binaries/ffmpeg-$TARGET" "$RUNNER_TEMP/horus-bin/ffmpeg"
          PATH="$RUNNER_TEMP/horus-bin:$PATH" pnpm --filter horus-desktop exec cargo test --manifest-path src-tauri/Cargo.toml --locked media_integration -- --ignored 2>&1 | tee .ci-logs/media.log
      - name: Construire et signer le DMG pour usage personnel
        run: pnpm --filter horus-desktop exec tauri build --config src-tauri/tauri.release.conf.json --target "$TARGET" --bundles dmg -- --locked 2>&1 | tee .ci-logs/bundle.log
      - name: Vérifier le bundle et le DMG
        run: |
          bundle="apps/HorusDesktop/src-tauri/target/$TARGET/release/bundle"
          mkdir -p build/installers
          images=("$bundle"/dmg/*.dmg)
          [[ "${#images[@]}" == 1 ]]
          bash scripts/release/verify-dmg.sh "${images[0]}" "$ARCH"
          cp "${images[0]}" "build/installers/HorusDesktop-$VERSION-macos-$SUFFIX.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.suffix }}
          path: build/installers/*.dmg
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-release-desktop-${{ matrix.suffix }}
          path: .ci-logs/
          include-hidden-files: true
          retention-days: 7

  build-windows-linux:
    needs: [version, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - runner: ubuntu-24.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            bundle: deb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
      CARGO_TERM_COLOR: never
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      BUNDLE: ${{ matrix.bundle }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - run: mkdir -p .ci-logs
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Installer les dépendances Linux et FFmpeg pour les fixtures
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev patchelf ffmpeg
      - name: Installer les outils FFmpeg Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            make diffutils perl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.88.0 --profile minimal --target "$TARGET"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/HorusDesktop/src-tauri/target
          key: release-cargo-${{ runner.os }}-${{ runner.arch }}-1.88-${{ hashFiles('apps/HorusDesktop/src-tauri/Cargo.lock', 'apps/HorusDesktop/src-tauri/src/**', 'apps/HorusDesktop/src-tauri/*.json') }}
          restore-keys: release-cargo-${{ runner.os }}-${{ runner.arch }}-1.88-
      - uses: actions/cache@v4
        with:
          path: build/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/release/*ffmpeg*') }}
      - name: Compiler FFmpeg Linux et générer les fixtures
        if: runner.os == 'Linux'
        run: |
          bash scripts/release/build-ffmpeg.sh 2>&1 | tee .ci-logs/ffmpeg.log
          pnpm --filter horus-desktop test:fixtures
      - name: Compiler FFmpeg Windows et générer les fixtures
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          bash scripts/release/build-ffmpeg.sh 2>&1 | tee .ci-logs/ffmpeg.log
          node apps/HorusDesktop/tests/generate-media.mjs
      - name: Tester Desktop et le moteur média avec FFmpeg embarqué
        run: |
          pnpm --filter horus-desktop test 2>&1 | tee .ci-logs/desktop-tests.log
          node scripts/release/test-desktop-media.mjs 2>&1 | tee .ci-logs/media.log
      - name: Construire l'installateur
        run: pnpm --filter horus-desktop exec tauri build --config "src-tauri/tauri.$PLATFORM.release.conf.json" --target "$TARGET" --bundles "$BUNDLE" -- --locked 2>&1 | tee .ci-logs/bundle.log
      - name: Vérifier le paquet Linux
        if: runner.os == 'Linux'
        run: bash scripts/release/verify-deb.sh 2>&1 | tee .ci-logs/installer.log
      - name: Installer et vérifier le paquet Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/release/verify-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-x64
          path: build/installers/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-release-desktop-${{ matrix.platform }}-x64
          path: .ci-logs/
          include-hidden-files: true
          retention-days: 7

  draft:
    needs: [version, build, build-windows-linux]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: build/installers
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: node scripts/release/github-release.mjs draft "$TAG" build/installers
