name: Publier les manifestes de mise à jour
run-name: Manifestes de mise à jour · ${{ github.event_name }}

on:
  release:
    types: [published, edited, unpublished, deleted]
  workflow_run:
    workflows: [Publier une release vérifiée]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: updates-pages
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - name: Lancer le déploiement depuis la branche par défaut
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run updates.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
  deploy:
    if: >-
      github.event_name != 'release' && github.ref_name == github.event.repository.default_branch &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/configure-pages@v5
      - name: Vérifier les releases publiées et générer les manifestes stables
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/update-manifests.mjs build/updates-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/updates-site
      - uses: actions/deploy-pages@v4
        id: deployment
